# alpha — the public demo of SearchForAlpha Lab (Dash on waitress, frozen snapshot).
# Email-gated: visitors verify an address and get a trial (demo/access/).
# The mail account and the admin token live ONLY in /opt/sites/alpha/.env
# (site-deploy.sh creates it, 0600), never in this file:
#   NEO_SMTP_HOST, NEO_SMTP_PORT, NEO_SMTP_USER, NEO_SMTP_PASS, EMAIL_FROM,
#   DEMO_ADMIN_TOKEN
# The mail names and values are Capsar's Neo account, copied from its .env --
# except NEO_SMTP_PORT, which must be 587 here (this server blocks outbound 465),
# and EMAIL_FROM, which is support@noeinsolutions.com (an alias of the mailbox).
# They are deliberately not listed under `environment:` below, because a key
# there overrides the same key in .env. Without the host, user and password
# the demo refuses to start (docs/DEMO.md, "Deploying the gate").
services:
  web:
    build:
      # Context is the site directory, not the checkout, so the Dockerfile lives
      # outside the cloned repo and .dockerignore keeps .env and repo/.git out.
      context: .
      dockerfile: Dockerfile
    image: site-alpha:${SITE_TAG:-latest}
    container_name: site-alpha-web
    env_file:
      - .env
    environment:
      # The kill switch. Set it to "false" and redeploy: every page 404s, the
      # health check still answers, and the dashboard is never imported.
      DEMO_MODE: "true"
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: "8050"
      DEMO_THREADS: "8"
      # Limits (defaults in demo/settings.py, repeated here so the running
      # values are readable without opening the code).
      DEMO_MAX_SESSIONS: "60"
      DEMO_SESSION_IDLE_MINUTES: "30"
      DEMO_MAX_COMBOS: "150"
      DEMO_MAX_SIGNALS_PER_SIDE: "2"
      DEMO_MAX_GRID_COMBOS: "250"
      DEMO_MAX_BAYES_TRIALS: "30"
      DEMO_OPTIMIZER_WORKERS: "2"
      DEMO_MAX_CONCURRENT_JOBS: "2"
      DEMO_JOB_TIMEOUT_SECONDS: "120"
      DEMO_ACTIONS_PER_IP_PER_MINUTE: "30"
      DEMO_JOBS_PER_IP_PER_HOUR: "20"
      # Access gate and trial (defaults in demo/access/settings.py).
      DEMO_ACCESS_GATE: "true"
      DEMO_ACCESS_DB: /app/data/access.sqlite3
      DEMO_PUBLIC_URL: https://alpha.demos.noeinsolutions.com
      DEMO_MAIL_BACKEND: smtp
      DEMO_TRIAL_DAYS: "7"
      DEMO_JOBS_PER_EMAIL_PER_DAY: "25"
      DEMO_RETENTION_DAYS: "365"
      DEMO_CODE_MINUTES: "15"
      DEMO_CODE_ATTEMPTS: "5"
      DEMO_CODES_PER_EMAIL_PER_HOUR: "3"
      DEMO_CODES_PER_HOUR: "60"
      # The Neo mailbox sends about 1,000 a day in total, shared with the
      # owner's own mail and Capsar's; the demo may use a fifth of it.
      DEMO_CODES_PER_DAY: "200"
      DEMO_SIGNUPS_PER_IP_PER_DAY: "5"
      SFA_LOG_LEVEL: INFO
    volumes:
      # The one thing the demo keeps across restarts and redeploys: who has
      # access and what they used. `docker compose down` keeps it; only
      # `down -v` or `docker volume rm` deletes it.
      - access-data:/app/data
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Optuna's study database and the trial store (grid search, Bayesian
      # sweep) live under state/. In RAM, so a restart forgets every run.
      - /app/state:size=64m,mode=1777
      - /tmp:size=64m,mode=1777
      - /home/demo:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The hard ceiling under the demo's own caps: whatever visitors do, this
    # container gets at most two of the server's eight cores and 1.5 GB.
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8050/healthz', timeout=5).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  access-data:

networks:
  edge:
    external: true
