# alpha — alpha.demos.noeinsolutions.com
# Generated by the `hetzner-site` skill from templates/vhost.conf.tpl.
# Do not edit on the server: site-deploy.sh overwrites it from the repo copy.

# HTTP — ACME challenge only, everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name alpha.demos.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxies to the site container over the shared `edge` network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alpha.demos.noeinsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/alpha.demos.noeinsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.demos.noeinsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 24m, not the 4m default: opening the Data table makes the browser POST
    # the table's JSON back with every table callback (demo/patches.py,
    # _patch_data_display). Nothing else comes close.
    client_max_body_size 24m;
    # burst 200, not the template's 40: a Dash page fires its initial callbacks
    # as one volley, and opening the optimiser workspace went past 40 queued
    # requests on a single visit (503s in the capture run, 14 Sep 2026). The
    # zone's sustained rate (20 r/s per IP, 00-sites.conf) is unchanged; the
    # CPU-heavy callbacks are limited inside the app (demo/guards.py).
    limit_req zone=site_limit burst=200 nodelay;

    # Dash answers in JSON; chart payloads for twenty years of bars are large
    # and compress about tenfold.
    gzip_comp_level 5;

    # Upstream held in a variable so the http-level resolver (00-sites.conf)
    # resolves it per request. A stopped container returns 502 for this host
    # only — it can never stop nginx from starting and take Capsar down.
    set $upstream_alpha "site-alpha-web:8050";

    location / {
        proxy_pass         http://$upstream_alpha;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Never serve dotfiles (.git, .env, editor leftovers) even by accident.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
