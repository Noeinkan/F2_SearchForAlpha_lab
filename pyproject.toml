[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchforalpha"
version = "0.2.0"
description = "Algorithmic trading research platform with backtest, walk-forward, Bayesian optimisation, and IB paper trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SearchForAlpha contributors" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "ta>=0.11",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "tqdm>=4.65",
    "psutil>=5.9",
    "typer>=0.12",
    "optuna>=3.5",
    "structlog>=24.0",
    "pydantic>=2.5",
    "ib_async>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
sfa = "lib.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
exclude = ["lib.WIP*", "lib.tests*"]

[tool.pytest.ini_options]
testpaths = ["lib/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
files = ["lib/cli", "lib/bayesian_optimization.py", "lib/walkforward", "lib/promotion", "lib/live", "lib/store"]
ignore_missing_imports = true
