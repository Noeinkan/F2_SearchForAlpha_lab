# alpha-lab — alpha.noeinsolutions.com
# Generated by the `hetzner-site` skill from templates/vhost.conf.tpl.
# Do not edit on the server: site-deploy.sh overwrites it from the repo copy.

# HTTP — ACME challenge only, everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name alpha.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxies to the site container over the shared `edge` network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alpha.noeinsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/alpha.noeinsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.noeinsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 24m: the Data table POSTs its JSON back with every table callback.
    client_max_body_size 24m;
    # burst 200, as on the demo: a Dash page fires its initial callbacks as
    # one volley, and the optimiser workspace alone goes past 40.
    limit_req zone=site_limit burst=200 nodelay;

    gzip_comp_level 5;

    # Upstream held in a variable so the http-level resolver (00-sites.conf)
    # resolves it per request. A stopped container returns 502 for this host
    # only — it can never stop nginx from starting and take Capsar down.
    set $upstream_alpha_lab "site-alpha-lab-web:8050";

    location / {
        proxy_pass         http://$upstream_alpha_lab;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # An optimiser callback can run for minutes.
        proxy_read_timeout 300s;
    }

    # Never serve dotfiles (.git, .env, editor leftovers) even by accident.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
