# Agent runtime configuration.
# Read by the sfa CLI for live (paper) trading and the promotion gate.

ib:
  host: 127.0.0.1
  port: 4002           # paper port; live (4001) is refused at the CLI layer
  client_id: 7

guards:
  max_daily_loss_pct: 0.02
  max_position_pct: 0.25
  max_disconnect_seconds: 60
  max_clock_drift_seconds: 5
  max_order_quantity: 1000
  max_order_notional: 100000.0

promotion:
  min_oos_sharpe_mean: 1.0
  max_degradation: 0.4
  walkforward_max_age_days: 7

optimiser:
  composite_weights:
    sortino: 1.0
    max_drawdown: 2.0
    turnover: 0.5
  tpe_seed: 42
  n_warmup_steps: 20

# ── Research context (read by the agent, not by execution logic) ──────────────
# These settings guide OpenClaw's research commentary and sweep decisions.
# They do NOT affect backtesting or guard behaviour — those are above.

research:
  # When enabled, run all strategies against one fixed ticker before any
  # cross-ticker expansion. Set ticker to the symbol you want to focus on.
  # Set enabled: false to return to normal multi-ticker sweep mode.
  single_target_mode:
    enabled: false
    ticker: SPY
    window: in_sample      # which backtest_window to use (in_sample|stress|recent)

  # Ticker universe for cross-validation sweeps.
  # Agent proposes which to test; human approves before sfa optimise runs.
  ticker_universe:
    etf_broad:
      - SPY    # S&P 500 — baseline for all strategies
      - QQQ    # Nasdaq 100 — higher beta, stronger momentum signals
      - IWM    # Russell 2000 — small cap, more mean-reversion alpha
      - DIA    # Dow Industrials — lower-beta broad equity benchmark
      - VTI    # Total US market — broad beta without mega-cap concentration
    etf_sector:
      - XLK    # Technology — trend-following friendly
      - XLF    # Financials — rate-sensitive, good for regime tests
      - XLE    # Energy — high volatility, good for BB/CCI strategies
      - XLV    # Health care — defensive growth, lower beta
      - XLI    # Industrials — cyclical trend confirmation
      - XLY    # Consumer discretionary — growth / risk-on proxy
      - XLP    # Consumer staples — defensive mean-reversion check
      - XLU    # Utilities — defensive / rates-sensitive sleeve
    etf_style_factor:
      - VUG    # Growth factor — momentum-friendly benchmark
      - VTV    # Value factor — slower regime rotation benchmark
      - MTUM   # Momentum factor — specialist trend sleeve
      - QUAL   # Quality factor — defensive trend sleeve
      - USMV   # Minimum volatility — low-vol regime benchmark
      - SCHD   # Dividend quality — slower, income-oriented benchmark
    etf_international:
      - EFA    # Developed ex-US — broad international benchmark
      - VXUS   # Total international — all-world ex-US check
      - EEM    # EM large-cap — higher-vol international sleeve
      - IEMG   # Core EM — broader emerging markets exposure
      - EWJ    # Japan — liquid single-country developed market
      - VGK    # Europe — developed macro / rates sensitivity
    etf_fixed_income:
      - AGG    # US aggregate bonds — core duration benchmark
      - TLT    # Long duration Treasuries — macro / rates convexity
      - IEF    # Intermediate Treasuries — smoother duration proxy
      - TIP    # Inflation-linked Treasuries — inflation regime check
      - LQD    # Investment grade credit — spread-sensitive benchmark
      - HYG    # High yield credit — risk-on / spread beta sleeve
    etf_commodity_physical:
      - GLD    # Physical gold proxy — crisis / inflation hedge
      - IAU    # Physical gold proxy — lower-fee gold benchmark
      - SLV    # Physical silver proxy — higher-beta precious metals
    etf_commodity_futures:
      - DBC    # Broad commodity basket — diversified futures sleeve
      - PDBC   # Broad commodity basket with optimized roll methodology
      - DBA    # Agriculture futures basket — food / softs exposure
      - USO    # Oil futures sleeve — high roll-yield sensitivity
      - UNG    # Natural gas futures sleeve — very high curve sensitivity
    etf_commodity_equity_linked:
      - GDX    # Gold miners — equity-linked commodity beta
      - GDXJ   # Junior gold miners — higher-vol precious metals beta
      - COPX   # Copper miners — industrial metals cycle proxy
      - URA    # Uranium / nuclear theme — specialist commodity equity sleeve
    notes: >
      Start sweeps with liquid benchmark ETF sleeves first: etf_broad, then the
      most relevant cross-asset benchmark sleeve such as etf_fixed_income,
      etf_international, or etf_commodity_physical. Expand to etf_sector,
      etf_style_factor, and commodity specialist sleeves only for strategies
      that show Sortino > 1.5 on at least two benchmark ETFs. Treat
      etf_commodity_futures as second-pass research because roll yield and curve
      shape can dominate returns. For ad-hoc ticker tests (individual stocks,
      S&P 500 constituents, or any other symbol), use sfa backtest --ticker
      <SYMBOL> — the dynamic ticker resolver in lib/data_processing.py will
      resolve any valid ticker from the comprehensive built-in universe
      (GitHub/Wikipedia/local fallback).

  # Optional seeded exploration layer.
  # Keep this disabled for deterministic default sweeps.
  # When enabled, always run the benchmark groups first, then sample extra ETFs
  # from eligible_groups using each listed seed. Exploration is advisory only:
  # do not optimise, promote, or paper-run from a single lucky seed.
  exploration:
    enabled: true
    mode: seeded_stratified
    benchmark_groups:
      - etf_broad
      - etf_fixed_income
      - etf_commodity_physical
    eligible_groups:
      - etf_sector
      - etf_style_factor
      - etf_international
      - etf_commodity_equity_linked
    excluded_groups:
      - etf_commodity_futures
    seeds: [11, 23, 47]
    sample_per_group: 1
    max_random_tickers: 4
    advisory_only: true

  # Cost model for Research notes (not used in backtest engine).
  cost_model:
    slippage_bps: 5          # conservative estimate for liquid ETFs
    commission_usd: 0.0      # IB paper account: zero commissions
    sector_etf_slippage_bps: 7
    international_etf_slippage_bps: 8
    commodity_physical_slippage_bps: 8
    commodity_futures_slippage_bps: 12
    annual_drag_estimate: >
      Multiply (avg_trades_per_year × slippage_bps / 10000) by capital
      to get estimated annual cost drag. Flag strategies above 2% drag.

  # Canonical backtest windows for research sweeps.
  backtest_windows:
    in_sample:
      from: "2020-01-01"
      to:   "2023-12-31"
      label: "4-year in-sample (bull + COVID + bear + recovery)"
    stress:
      from: "2022-01-01"
      to:   "2022-12-31"
      label: "2022 bear market — rate-hike regime"
    recent:
      from: "2023-01-01"
      to:   "2025-12-31"
      label: "2023-2025 AI-driven bull run"
    notes: >
      Always run in_sample first. Run stress if Sortino > 1.0 in-sample.
      Run recent to check for regime decay in promoted strategies.

  # Regime detection hints (descriptive — agent uses these for commentary).
  regime_signals:
    trending:   "SPY closing price above its 200-day SMA"
    ranging:    "SPY within 5% of 200-day SMA for 30+ days"
    volatile:   "realised 30-day vol > 20% annualised"
    bear:       "SPY down > 20% from 52-week high"

  # Strategy-to-ticker affinity hints.
  # Based on academic literature and community backtests.
  strategy_affinity:
    mean_reversion:   [SPY, IWM, XLP, AGG]   # liquid, range-bound, defensive sleeves
    trend_following:  [QQQ, XLK, MTUM, EFA]  # trending equity + factor benchmarks
    momentum:         [QQQ, XLE, MTUM, EEM]  # breakouts and higher-beta rotations
    volatility_play:  [IWM, XLE, HYG, GLD]   # wider bands on volatile / macro sleeves
    vwap_intraday:    [SPY, QQQ, XLF, GLD]   # highest-liquidity ETF proxies
