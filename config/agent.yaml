    notes: >
      Start sweeps with liquid benchmark ETF sleeves first: etf_broad, then the
      most relevant cross-asset benchmark sleeve such as etf_fixed_income,
      etf_international, or etf_commodity_physical. Expand to etf_sector,
      etf_style_factor, and commodity specialist sleeves only for strategies
      that show Sortino > 1.5 on at least two benchmark ETFs. Treat
      etf_commodity_futures as second-pass research because roll yield and curve
      shape can dominate returns. Use sp500_* stock baskets only after ETF
      robustness is established.

  # Cost model for Research notes (not used in backtest engine).
  cost_model:
    slippage_bps: 5          # conservative estimate for liquid ETFs
    commission_usd: 0.0      # IB paper account: zero commissions
    sector_etf_slippage_bps: 7
    international_etf_slippage_bps: 8
    commodity_physical_slippage_bps: 8
    commodity_futures_slippage_bps: 12
    annual_drag_estimate: >
      Multiply (avg_trades_per_year × slippage_bps / 10000) by capital
      to get estimated annual cost drag. Flag strategies above 2% drag.

  # Canonical backtest windows for research sweeps.
  backtest_windows:
    in_sample:
      from: "2020-01-01"
      to:   "2023-12-31"
      label: "4-year in-sample (bull + COVID + bear + recovery)"
    stress:
      from: "2022-01-01"
      to:   "2022-12-31"
      label: "2022 bear market — rate-hike regime"
    recent:
      from: "2023-01-01"
      to:   "2025-12-31"
      label: "2023-2025 AI-driven bull run"
    notes: >
      Always run in_sample first. Run stress if Sortino > 1.0 in-sample.
      Run recent to check for regime decay in promoted strategies.

  # Regime detection hints (descriptive — agent uses these for commentary).
  regime_signals:
    trending:   "SPY closing price above its 200-day SMA"
    ranging:    "SPY within 5% of 200-day SMA for 30+ days"
    volatile:   "realised 30-day vol > 20% annualised"
    bear:       "SPY down > 20% from 52-week high"

  # Strategy-to-ticker affinity hints.
  # Based on academic literature and community backtests.
  strategy_affinity:
    mean_reversion:   [SPY, IWM, XLP, AGG]   # liquid, range-bound, defensive sleeves
    trend_following:  [QQQ, XLK, MTUM, EFA]  # trending equity + factor benchmarks
    momentum:         [QQQ, XLE, MTUM, EEM]  # breakouts and higher-beta rotations
    volatility_play:  [IWM, XLE, HYG, GLD]   # wider bands on volatile / macro sleeves
    vwap_intraday:    [SPY, QQQ, XLF, GLD]   # highest-liquidity ETF proxies
