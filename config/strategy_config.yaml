# Strategy Configuration File
# This file contains all tunable parameters for trading strategies.
# Modify values here instead of in the source code for easier experimentation.

strategies:
  sma:
    sma:
      short_window: 5
      medium_window: 20
      long_window: 50
      trend_window: 200
    crossover:
      threshold: 0.001

  ema:
    ema:
      short_window: 12
      medium_window: 26
      long_window: 50
    crossover:
      threshold: 0.001

  rsi:
    rsi:
      window: 14
    overbought_oversold:
      upper_threshold: 70
      lower_threshold: 30
    divergence:
      lookback_period: 10

  bollinger_bands:
    bollinger_bands:
      window: 20
      window_dev: 2
    squeeze_strategy:
      squeeze_threshold: 0.1
    double_bottom_top_strategy:
      threshold: 0.02

  cci:
    cci:
      window: 20
    overbought_oversold:
      upper_threshold: 100
      lower_threshold: -100
    trend_reversal:
      extreme_threshold: 180

  macd:
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    zero_cross:
      threshold: 0
    signal_cross:
      threshold: 0

  vwap:
    vwap:
      window: 20

  # ADX / ATR / OBV are regime and confirmation filters rather than standalone
  # entries. They are registered like any other strategy but their categories
  # start unticked in the dashboard SIGNALS panel
  # (see DEFAULT_OFF_SIGNAL_CATEGORIES in lib/dash/dash_config.py).
  adx:
    adx:
      window: 14
    trend_regime:
      threshold: 25
    range_regime:
      threshold: 20

  atr:
    atr:
      window: 14
    # Ratio of ATR% to its own rolling mean; ~top decile / bottom quintile.
    expansion:
      lookback: 20
      factor: 1.2
    compression:
      factor: 0.9
    breakout:
      multiplier: 1.5

  obv:
    obv:
      ma_period: 20
    divergence:
      lookback_period: 20
    confirmation:
      lookback_period: 5

# Signal/strategy discovery controls (optional)
signal_registry:
  # Optional explicit order override. Leave empty to use strategy metadata priority.
  order: []
  allowlist: []
  denylist: []
  # Optional per-strategy priority override (lower runs first), e.g. {rsi: 15}
  priorities: {}

# Backtest defaults
backtest:
  initial_capital: 10000
  percent_of_portfolio: 0.1
  delay: 1

# Shared execution-layer search space (fractions, not UI percentages).
# Merged into a bundle's search_space by `sfa grid-search --include-execution`
# or when a bundle declares the same keys locally. Keep steps coarse — the
# cartesian product is hard-capped by --max-combos (default 250).
execution_search_space:
  min_holding_period: { type: int, low: 0, high: 10, step: 5 }
  trailing_stop_loss: { type: float, low: 0.03, high: 0.10, step: 0.01 }
  take_profit: { type: float, low: 0.0, high: 0.15, step: 0.05 }
  position_scaling: { type: float, low: 0.25, high: 1.0, step: 0.25 }
  stop_mode: { type: categorical, choices: [percent, atr] }
  consecutive_signal_mode: { type: categorical, choices: [scale_in, edge, cooldown] }
  cooldown_bars: { type: int, low: 0, high: 10, step: 5 }

# ML Strategy defaults
ml_strategy:
  test_size: 0.2
  random_state: 42
  n_estimators: 100

# Agent strategy bundles. Each entry is a (ticker, signals, params, mode)
# bundle that the sfa CLI can backtest, optimise, walk forward, and run.
# Note: the older top level "strategies" key above holds per indicator
# parameters and is kept untouched. Agent bundles live under their own key
# to avoid conflicting with that schema.
agent_strategies:
  mean_reversion_rsi_bb:
    description: "RSI oversold and Bollinger lower band entries, RSI overbought exit."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy, BB_MeanReversion_Buy]
    sell_signals: [RSI_Overbought_Sell, BB_MeanReversion_Sell]
    mode: trading
    live_params:
      rsi_window: 14
      bb_window: 20
      bb_std: 2.0
    search_space:
      rsi_window: { type: int, low: 5, high: 30 }
      rsi_overbought: { type: int, low: 65, high: 85 }
      rsi_oversold: { type: int, low: 15, high: 35 }
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.0, high: 3.0 }

  trend_macd_ema:
    description: "Trend follower: MACD signal cross with EMA triple alignment, MACD signal cross exit."
    ticker: SPY
    buy_signals: [MACD_SignalCross_Buy, EMA_TripleCross_Buy]
    sell_signals: [MACD_SignalCross_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      ema_short: 12
      ema_medium: 26
      ema_long: 50
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }
      ema_short: { type: int, low: 5, high: 20 }
      ema_medium: { type: int, low: 20, high: 60 }
      ema_long: { type: int, low: 60, high: 200 }

  breakout_bb_squeeze:
    description: "Bollinger squeeze breakout long, squeeze breakdown short."
    ticker: SPY
    buy_signals: [BB_Squeeze_Buy]
    sell_signals: [BB_Squeeze_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }

  momentum_cci_macd:
    description: "Momentum: CCI zero cross confirmed by MACD histogram flip, both ways."
    ticker: SPY
    buy_signals: [CCI_ZeroCross_Buy, MACD_Histogram_Buy]
    sell_signals: [CCI_ZeroCross_Sell, MACD_Histogram_Sell]
    signal_logic: and
    signal_window: 3
    mode: trading
    live_params:
      cci_window: 20
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  golden_cross_sma:
    description: "Slow trend: SMA triple cross long and short."
    ticker: SPY
    buy_signals: [SMA_TripleCross_Buy]
    sell_signals: [SMA_TripleCross_Sell]
    mode: trading
    live_params:
      sma_short: 20
      sma_medium: 50
      sma_long: 200
    search_space:
      sma_short: { type: int, low: 5, high: 30 }
      sma_medium: { type: int, low: 30, high: 100 }
      sma_long: { type: int, low: 100, high: 250 }

  connors_rsi2:
    description: "Larry Connors 2-period RSI mean reversion: deep oversold long, overbought exit."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy]
    sell_signals: [RSI_Overbought_Sell]
    mode: trading
    live_params:
      rsi_window: 2
      rsi_oversold: 10
      rsi_overbought: 70
    search_space:
      rsi_window: { type: int, low: 2, high: 5 }
      rsi_oversold: { type: int, low: 5, high: 25 }
      rsi_overbought: { type: int, low: 60, high: 85 }

  bb_breakout:
    description: "Classic Bollinger band breakout long, breakdown short."
    ticker: SPY
    buy_signals: [BB_Breakout_Buy]
    sell_signals: [BB_Breakout_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }

  bb_double_pattern:
    description: "Bollinger double bottom long, double top short."
    ticker: SPY
    buy_signals: [BB_DoubleBottom_Buy]
    sell_signals: [BB_DoubleTop_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
      bb_double_lookback: 20
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }
      bb_double_lookback: { type: int, low: 5, high: 20 }

  macd_zero_cross:
    description: "MACD zero line cross trend reversal long and short."
    ticker: SPY
    buy_signals: [MACD_ZeroCross_Buy]
    sell_signals: [MACD_ZeroCross_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  macd_histogram_flip:
    description: "MACD histogram momentum flip, both directions."
    ticker: SPY
    buy_signals: [MACD_Histogram_Buy]
    sell_signals: [MACD_Histogram_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  macd_rsi_combo:
    description: "MACD signal cross confirmed by RSI extreme; widely cited combo (~73% win rate backtest)."
    ticker: SPY
    buy_signals: [MACD_SignalCross_Buy, RSI_Oversold_Buy]
    sell_signals: [MACD_SignalCross_Sell, RSI_Overbought_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      rsi_window: 14
      rsi_oversold: 30
      rsi_overbought: 70
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }
      rsi_window: { type: int, low: 5, high: 30 }
      rsi_oversold: { type: int, low: 15, high: 40 }
      rsi_overbought: { type: int, low: 60, high: 85 }

  cci_extreme_reversal:
    description: "CCI rebound from extreme low, turn down from extreme high."
    ticker: SPY
    buy_signals: [CCI_Reversal_Buy]
    sell_signals: [CCI_Reversal_Sell]
    mode: trading
    live_params:
      cci_window: 20
      cci_extreme: 180
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      cci_extreme: { type: int, low: 120, high: 250 }

  cci_oversold_meanrev:
    description: "CCI oversold long, overbought short; classic Lambert mean reversion."
    ticker: SPY
    buy_signals: [CCI_Oversold_Buy]
    sell_signals: [CCI_Overbought_Sell]
    mode: trading
    live_params:
      cci_window: 20
      cci_upper: 100
      cci_lower: -100
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      cci_upper: { type: int, low: 80, high: 200 }
      cci_lower: { type: int, low: -200, high: -80 }

  ema_pullback_value:
    description: "Buy the dip into EMA value zone in uptrend, mirror in downtrend."
    ticker: SPY
    buy_signals: [EMA_ValueZone_Buy]
    sell_signals: [EMA_ValueZone_Sell]
    mode: trading
    live_params:
      ema_short: 12
      ema_medium: 26
      ema_long: 50
    search_space:
      ema_short: { type: int, low: 5, high: 20 }
      ema_medium: { type: int, low: 20, high: 60 }
      ema_long: { type: int, low: 60, high: 200 }

  vwap_cross:
    description: "Price crosses above VWAP long, below VWAP short."
    ticker: SPY
    buy_signals: [VWAP_CrossAbove_Buy]
    sell_signals: [VWAP_CrossBelow_Sell]
    mode: trading
    live_params:
      vwap_window: 20
    search_space:
      vwap_window: { type: int, low: 5, high: 60 }

  # Regime-gated variants of the bundles above. These are additive — the
  # ungated originals are left untouched so their results stay comparable.
  trend_macd_ema_adx_gated:
    description: "MACD signal cross only while ADX confirms a directional trend."
    ticker: SPY
    buy_signals: [MACD_SignalCross_Buy, ADX_TrendRegime_Buy]
    sell_signals: [MACD_SignalCross_Sell, ADX_TrendRegime_Sell]
    signal_logic: and
    signal_window: 3
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      adx_window: 14
      adx_trend_threshold: 25
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }
      adx_window: { type: int, low: 7, high: 30 }
      adx_trend_threshold: { type: int, low: 15, high: 40 }

  mean_reversion_rsi_range_gated:
    description: "RSI mean reversion only while ADX says the market is ranging."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy, ADX_RangeRegime_Buy]
    sell_signals: [RSI_Overbought_Sell, ADX_RangeRegime_Sell]
    signal_logic: and
    signal_window: 2
    mode: trading
    live_params:
      rsi_window: 14
      rsi_oversold: 30
      rsi_overbought: 70
      adx_window: 14
      adx_range_threshold: 20
    search_space:
      rsi_window: { type: int, low: 5, high: 30 }
      rsi_oversold: { type: int, low: 15, high: 35 }
      rsi_overbought: { type: int, low: 65, high: 85 }
      adx_window: { type: int, low: 7, high: 30 }
      adx_range_threshold: { type: int, low: 12, high: 28 }

  bb_squeeze_vol_confirmed:
    description: "Bollinger squeeze breakout confirmed by an ATR volatility thrust."
    ticker: SPY
    buy_signals: [BB_Squeeze_Buy, ATR_Breakout_Buy]
    sell_signals: [BB_Squeeze_Sell, ATR_Breakout_Sell]
    signal_logic: and
    signal_window: 3
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
      atr_window: 14
      atr_breakout_multiplier: 1.5
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }
      atr_window: { type: int, low: 7, high: 30 }
      atr_breakout_multiplier: { type: float, low: 0.5, high: 3.0 }

  trend_ema_obv_confirmed:
    description: "EMA triple cross confirmed by agreeing OBV volume flow."
    ticker: SPY
    buy_signals: [EMA_TripleCross_Buy, OBV_Confirmation_Buy]
    sell_signals: [EMA_TripleCross_Sell, OBV_Confirmation_Sell]
    signal_logic: and
    signal_window: 3
    mode: trading
    live_params:
      ema_short: 12
      ema_medium: 26
      ema_long: 50
      obv_ma_period: 20
      obv_confirmation_lookback: 5
    search_space:
      ema_short: { type: int, low: 5, high: 20 }
      ema_medium: { type: int, low: 20, high: 60 }
      ema_long: { type: int, low: 60, high: 200 }
      obv_ma_period: { type: int, low: 5, high: 50 }
      obv_confirmation_lookback: { type: int, low: 2, high: 20 }

  connors_rsi2_range_gated:
    description: "Connors 2-period RSI mean reversion, only while ADX says the market is ranging."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy, ADX_RangeRegime_Buy]
    sell_signals: [RSI_Overbought_Sell, ADX_RangeRegime_Sell]
    signal_logic: and
    # Window 2, not 3: a 2-period RSI reverts within a couple of bars, so a
    # wider confirmation window would let the entry fire after the edge is gone.
    signal_window: 2
    mode: trading
    live_params:
      rsi_window: 2
      rsi_oversold: 10
      rsi_overbought: 70
      adx_window: 14
      adx_range_threshold: 20
    search_space:
      rsi_window: { type: int, low: 2, high: 5 }
      rsi_oversold: { type: int, low: 5, high: 25 }
      rsi_overbought: { type: int, low: 60, high: 85 }
      adx_window: { type: int, low: 7, high: 30 }
      adx_range_threshold: { type: int, low: 12, high: 28 }

  cci_oversold_meanrev_range_gated:
    description: "CCI Lambert mean reversion, only while ADX says the market is ranging."
    ticker: SPY
    buy_signals: [CCI_Oversold_Buy, ADX_RangeRegime_Buy]
    sell_signals: [CCI_Overbought_Sell, ADX_RangeRegime_Sell]
    signal_logic: and
    signal_window: 2
    mode: trading
    live_params:
      cci_window: 20
      cci_upper: 100
      cci_lower: -100
      adx_window: 14
      adx_range_threshold: 20
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      cci_upper: { type: int, low: 80, high: 200 }
      cci_lower: { type: int, low: -200, high: -80 }
      adx_window: { type: int, low: 7, high: 30 }
      adx_range_threshold: { type: int, low: 12, high: 28 }

  golden_cross_sma_adx_gated:
    description: "SMA triple cross only while ADX confirms a directional trend."
    ticker: SPY
    buy_signals: [SMA_TripleCross_Buy, ADX_TrendRegime_Buy]
    sell_signals: [SMA_TripleCross_Sell, ADX_TrendRegime_Sell]
    signal_logic: and
    # Window 5: the SMA cross is a slow event and ADX often confirms a few bars
    # after it, so a tighter window would drop most of the pairs entirely.
    signal_window: 5
    mode: trading
    live_params:
      sma_short: 20
      sma_medium: 50
      sma_long: 200
      adx_window: 14
      adx_trend_threshold: 25
    search_space:
      sma_short: { type: int, low: 5, high: 30 }
      sma_medium: { type: int, low: 30, high: 100 }
      sma_long: { type: int, low: 100, high: 250 }
      adx_window: { type: int, low: 7, high: 30 }
      adx_trend_threshold: { type: int, low: 15, high: 40 }

  adx_di_cross:
    description: "Standalone +DI/-DI crossover, already ADX-confirmed inside the signal."
    ticker: SPY
    buy_signals: [ADX_DICross_Buy]
    sell_signals: [ADX_DICross_Sell]
    mode: trading
    live_params:
      adx_window: 14
      adx_trend_threshold: 25
    search_space:
      adx_window: { type: int, low: 7, high: 30 }
      adx_trend_threshold: { type: int, low: 15, high: 40 }

  obv_divergence:
    description: "Price/OBV divergence: new price low unconfirmed by volume flow, and the mirror."
    ticker: SPY
    buy_signals: [OBV_Divergence_Buy]
    sell_signals: [OBV_Divergence_Sell]
    mode: trading
    live_params:
      obv_ma_period: 20
      obv_divergence_lookback: 20
    search_space:
      obv_ma_period: { type: int, low: 5, high: 50 }
      obv_divergence_lookback: { type: int, low: 10, high: 60 }

  atr_squeeze_breakout:
    description: "Pre-squeeze setup: ATR compression coiling, then an ATR thrust out of it."
    ticker: SPY
    buy_signals: [ATR_Compression_Buy, ATR_Breakout_Buy]
    sell_signals: [ATR_Compression_Sell, ATR_Breakout_Sell]
    signal_logic: and
    # Window 5: compression is the *prior* state and the thrust is what ends it,
    # so the two never fire on the same bar. The window is what links them.
    signal_window: 5
    mode: trading
    live_params:
      atr_window: 14
      atr_expansion_lookback: 20
      atr_compression_factor: 0.9
      atr_breakout_multiplier: 1.5
    search_space:
      atr_window: { type: int, low: 7, high: 30 }
      atr_expansion_lookback: { type: int, low: 10, high: 60 }
      atr_compression_factor: { type: float, low: 0.5, high: 0.99 }
      atr_breakout_multiplier: { type: float, low: 0.5, high: 3.0 }

