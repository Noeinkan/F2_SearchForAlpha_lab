# Strategy Configuration File
# This file contains all tunable parameters for trading strategies.
# Modify values here instead of in the source code for easier experimentation.

strategies:
  sma:
    sma:
      short_window: 5
      medium_window: 20
      long_window: 50
      trend_window: 200
    crossover:
      threshold: 0.001

  ema:
    ema:
      short_window: 12
      medium_window: 26
      long_window: 50
    crossover:
      threshold: 0.001

  rsi:
    rsi:
      window: 14
    overbought_oversold:
      upper_threshold: 70
      lower_threshold: 30
    divergence:
      lookback_period: 10

  bollinger_bands:
    bollinger_bands:
      window: 20
      window_dev: 2
    squeeze_strategy:
      squeeze_threshold: 0.1
    double_bottom_top_strategy:
      threshold: 0.02

  cci:
    cci:
      window: 20
    overbought_oversold:
      upper_threshold: 100
      lower_threshold: -100
    trend_reversal:
      extreme_threshold: 180

  macd:
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    zero_cross:
      threshold: 0
    signal_cross:
      threshold: 0

  vwap:
    vwap:
      window: 20

# Signal/strategy discovery controls (optional)
signal_registry:
  # Optional explicit order override. Leave empty to use strategy metadata priority.
  order: []
  allowlist: []
  denylist: []
  # Optional per-strategy priority override (lower runs first), e.g. {rsi: 15}
  priorities: {}

# Backtest defaults
backtest:
  initial_capital: 10000
  percent_of_portfolio: 0.1
  delay: 1

# ML Strategy defaults
ml_strategy:
  test_size: 0.2
  random_state: 42
  n_estimators: 100

# Agent strategy bundles. Each entry is a (ticker, signals, params, mode)
# bundle that the sfa CLI can backtest, optimise, walk forward, and run.
# Note: the older top level "strategies" key above holds per indicator
# parameters and is kept untouched. Agent bundles live under their own key
# to avoid conflicting with that schema.
agent_strategies:
  mean_reversion_rsi_bb:
    description: "RSI oversold and Bollinger lower band entries, RSI overbought exit."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy, BB_MeanReversion_Buy]
    sell_signals: [RSI_Overbought_Sell, BB_MeanReversion_Sell]
    mode: trading
    live_params:
      rsi_window: 14
      bb_window: 20
      bb_std: 2.0
    search_space:
      rsi_window: { type: int, low: 5, high: 30 }
      rsi_overbought: { type: int, low: 65, high: 85 }
      rsi_oversold: { type: int, low: 15, high: 35 }
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.0, high: 3.0 }

  trend_macd_ema:
    description: "Trend follower: MACD signal cross with EMA triple alignment, MACD signal cross exit."
    ticker: SPY
    buy_signals: [MACD_SignalCross_Buy, EMA_TripleCross_Buy]
    sell_signals: [MACD_SignalCross_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      ema_short: 12
      ema_medium: 26
      ema_long: 50
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }
      ema_short: { type: int, low: 5, high: 20 }
      ema_medium: { type: int, low: 20, high: 60 }
      ema_long: { type: int, low: 60, high: 200 }

  breakout_bb_squeeze:
    description: "Bollinger squeeze breakout long, squeeze breakdown short."
    ticker: SPY
    buy_signals: [BB_Squeeze_Buy]
    sell_signals: [BB_Squeeze_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }

  momentum_cci_macd:
    description: "Momentum: CCI zero cross confirmed by MACD histogram flip, both ways."
    ticker: SPY
    buy_signals: [CCI_ZeroCross_Buy, MACD_Histogram_Buy]
    sell_signals: [CCI_ZeroCross_Sell, MACD_Histogram_Sell]
    signal_logic: and
    signal_window: 3
    mode: trading
    live_params:
      cci_window: 20
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  golden_cross_sma:
    description: "Slow trend: SMA triple cross long and short."
    ticker: SPY
    buy_signals: [SMA_TripleCross_Buy]
    sell_signals: [SMA_TripleCross_Sell]
    mode: trading
    live_params:
      sma_short: 20
      sma_medium: 50
      sma_long: 200
    search_space:
      sma_short: { type: int, low: 5, high: 30 }
      sma_medium: { type: int, low: 30, high: 100 }
      sma_long: { type: int, low: 100, high: 250 }

  connors_rsi2:
    description: "Larry Connors 2-period RSI mean reversion: deep oversold long, overbought exit."
    ticker: SPY
    buy_signals: [RSI_Oversold_Buy]
    sell_signals: [RSI_Overbought_Sell]
    mode: trading
    live_params:
      rsi_window: 2
      rsi_oversold: 10
      rsi_overbought: 70
    search_space:
      rsi_window: { type: int, low: 2, high: 5 }
      rsi_oversold: { type: int, low: 5, high: 25 }
      rsi_overbought: { type: int, low: 60, high: 85 }

  bb_breakout:
    description: "Classic Bollinger band breakout long, breakdown short."
    ticker: SPY
    buy_signals: [BB_Breakout_Buy]
    sell_signals: [BB_Breakout_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }

  bb_double_pattern:
    description: "Bollinger double bottom long, double top short."
    ticker: SPY
    buy_signals: [BB_DoubleBottom_Buy]
    sell_signals: [BB_DoubleTop_Sell]
    mode: trading
    live_params:
      bb_window: 20
      bb_std: 2.0
      bb_double_lookback: 10
    search_space:
      bb_window: { type: int, low: 10, high: 50 }
      bb_std: { type: float, low: 1.5, high: 3.0 }
      bb_double_lookback: { type: int, low: 5, high: 20 }

  macd_zero_cross:
    description: "MACD zero line cross trend reversal long and short."
    ticker: SPY
    buy_signals: [MACD_ZeroCross_Buy]
    sell_signals: [MACD_ZeroCross_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  macd_histogram_flip:
    description: "MACD histogram momentum flip, both directions."
    ticker: SPY
    buy_signals: [MACD_Histogram_Buy]
    sell_signals: [MACD_Histogram_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }

  macd_rsi_combo:
    description: "MACD signal cross confirmed by RSI extreme; widely cited combo (~73% win rate backtest)."
    ticker: SPY
    buy_signals: [MACD_SignalCross_Buy, RSI_Oversold_Buy]
    sell_signals: [MACD_SignalCross_Sell, RSI_Overbought_Sell]
    mode: trading
    live_params:
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      rsi_window: 14
      rsi_oversold: 30
      rsi_overbought: 70
    search_space:
      macd_fast: { type: int, low: 5, high: 20 }
      macd_slow: { type: int, low: 20, high: 50 }
      macd_signal: { type: int, low: 5, high: 15 }
      rsi_window: { type: int, low: 5, high: 30 }
      rsi_oversold: { type: int, low: 15, high: 40 }
      rsi_overbought: { type: int, low: 60, high: 85 }

  cci_extreme_reversal:
    description: "CCI rebound from extreme low, turn down from extreme high."
    ticker: SPY
    buy_signals: [CCI_Reversal_Buy]
    sell_signals: [CCI_Reversal_Sell]
    mode: trading
    live_params:
      cci_window: 20
      cci_extreme: 180
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      cci_extreme: { type: int, low: 120, high: 250 }

  cci_oversold_meanrev:
    description: "CCI oversold long, overbought short; classic Lambert mean reversion."
    ticker: SPY
    buy_signals: [CCI_Oversold_Buy]
    sell_signals: [CCI_Overbought_Sell]
    mode: trading
    live_params:
      cci_window: 20
      cci_upper: 100
      cci_lower: -100
    search_space:
      cci_window: { type: int, low: 10, high: 40 }
      cci_upper: { type: int, low: 80, high: 200 }
      cci_lower: { type: int, low: -200, high: -80 }

  ema_pullback_value:
    description: "Buy the dip into EMA value zone in uptrend, mirror in downtrend."
    ticker: SPY
    buy_signals: [EMA_ValueZone_Buy]
    sell_signals: [EMA_ValueZone_Sell]
    mode: trading
    live_params:
      ema_short: 12
      ema_medium: 26
      ema_long: 50
    search_space:
      ema_short: { type: int, low: 5, high: 20 }
      ema_medium: { type: int, low: 20, high: 60 }
      ema_long: { type: int, low: 60, high: 200 }

  vwap_cross:
    description: "Price crosses above VWAP long, below VWAP short."
    ticker: SPY
    buy_signals: [VWAP_CrossAbove_Buy]
    sell_signals: [VWAP_CrossBelow_Sell]
    mode: trading
    live_params:
      vwap_window: 20
    search_space:
      vwap_window: { type: int, low: 5, high: 60 }

